<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGROOO Panel v__VERSION__</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,__ICON__">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy,flash_on&display=block" />
    <style>/* THEME_PLACEHOLDER */
/* CSS_PLACEHOLDER */</style>
    <script>
        (function () {
            var KEY = 'zag-theme';
            var root = document.documentElement;
            try {
                root.classList.toggle('dark', localStorage.getItem(KEY) !== 'light');
            } catch (e) {
                root.classList.add('dark');
            }
            document.addEventListener('click', function (event) {
                var button = event.target.closest && event.target.closest('#theme-toggle');
                if (!button) return;
                var isDark = root.classList.toggle('dark');
                try { localStorage.setItem(KEY, isDark ? 'dark' : 'light'); } catch (err) { /* storage blocked */ }
            });
        })();
    </script>
</head>

<body>
    <button id="theme-toggle" class="zag-theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
    </button>

    <div class="header">
        <img id="header-logo" src="data:image/x-icon;base64,__ICON__" alt="ZAGROOO Logo" width="48" height="48">
        <h1>
            ZAGROOO Panel
            <span class="panel-version">
                v__VERSION__
            </span>
        </h1>
    </div>

    <div class="table-wrapper">
        <table id="geo-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Proxy IP</th>
                    <th>Health rate</th>
                    <th>TCP Latency (ms)</th>
                    <th>Country</th>
                    <th>City</th>
                    <th>ISP</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { polyfillCountryFlagEmojis } from "https://cdn.skypack.dev/country-flag-emoji-polyfill";
        polyfillCountryFlagEmojis();
    </script>
    <script>/* JS_PLACEHOLDER */</script>
</body>

</html>
